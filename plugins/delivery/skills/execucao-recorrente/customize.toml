# Campos customizáveis desta skill e seus valores padrão. NÃO edite este arquivo (o plugin o sobrescreve).
# Para customizar num projeto, crie docs/{projeto}/_custom/{skill}.toml só com o que muda
# (skill sdd-customize; regras em sdd-setup/references/customizacao.md).

[workflow]
# Fatos válidos durante toda a skill: texto literal ou "file:glob" relativo à raiz do workspace
# (ex.: "file:docs/padroes/*.md").
persistent_facts = []
# Passos extras, em linguagem natural, antes do fluxo e depois dele.
activation_steps_prepend = []
activation_steps_append = []
# O que fazer ao terminar com sucesso (ex.: "lembre de atualizar o card no Redmine"). Vazio = nada.
on_complete = ""

# false desliga a execução recorrente neste projeto (o projeto continua na lista, mas é pulado).
habilitado = true
# Ações que o agente de entrega pode fazer sozinho neste projeto (a ordem da fila não depende desta lista):
#   "dev-story"    — implementa stories ready-for-dev e retoma as in-progress que ele começou ou que a
#                    story-review devolveu com correções;
#   "story-review" — revisa stories em review (num subagente, contexto separado da implementação);
#   "create-story" — cria a próxima story do backlog quando faltam stories prontas, com os campos de
#                    _custom/criacao-story-recorrente.toml (max_prontas, dependencias_em, exige_confirmacao).
# Stories blocked pela automação por causa de ambiente ou técnica voltam à fila quando a causa muda,
# na ação que as bloqueou. O valor do projeto substitui esta lista.
acoes = ["dev-story", "story-review", "create-story"]
# Falhas seguidas na mesma story e ação antes de parar de tentar (a story vai para blocked com o motivo).
max_tentativas = 3
# true = ao concluir uma story, faz commit local na branch feat/{id} com a commit_message do dev-story
# (nunca push nem merge). false = deixa as alterações sem commit na pasta de trabalho da story.
commit_ao_concluir = false
# Pasta de trabalho de cada story nos repositórios de código:
#   "worktree" — uma worktree da branch feat/{id} em {repositório}.worktrees/{id}, ao lado do repositório:
#                várias stories do mesmo repositório andam sem esperar commit, e o checkout principal
#                não é tocado;
#   "checkout" — a branch no checkout principal (comportamento antigo): com alterações de outra story
#                pendentes, a story espera.
isolamento = "worktree"
