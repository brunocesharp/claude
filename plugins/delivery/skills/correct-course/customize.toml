# Campos customizáveis desta skill e seus valores padrão. NÃO edite este arquivo (o plugin o sobrescreve).
# Para customizar num projeto, crie docs/{projeto}/_custom/{skill}.toml só com o que muda
# (skill sdd-customize; regras em sdd-setup/references/customizacao.md).

[workflow]
# Fatos válidos durante toda a skill: texto literal ou "file:glob" relativo à raiz do workspace
# (ex.: "file:docs/padroes/*.md").
persistent_facts = []
# Passos extras, em linguagem natural, antes do fluxo e depois dele.
activation_steps_prepend = []
activation_steps_append = []
# O que fazer ao terminar com sucesso (ex.: "lembre de atualizar o card no Redmine"). Vazio = nada.
on_complete = ""

# Quem aprova cada escopo de mudança (aparece na proposta).
[workflow.approvers]
menor = "Dev (o usuário confirma)"
moderado = "Responsável pelo backlog"
maior = "PO / arquiteto"
